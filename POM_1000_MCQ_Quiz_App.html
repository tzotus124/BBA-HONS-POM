ayol's administrative theory","b":"The behavioral approach","c":"Weber's bureaucracy","d":"Scientific management"},"a":"c","e":"","x":"The correct answer is <b>C<\/b>: Weber's bureaucracy.","y":["<b>D<\/b> is not correct: Scientific management refers to “Using the scientific method to find the “one best way” for a job to be done”."]},{"n":736,"w":3,"p":2,"q":"Materials are never where they are needed when they are needed. Which principle is violated?","o":{"a":"Esprit de corps","b":"Centralization","c":"Unity of command","d":"Order"},"a":"d","e":"","x":"The correct answer is <b>D<\/b>: Order.","y":[]},{"n":737,"w":3,"p":2,"q":"Which TQM characteristic is described as follows: includes outsiders who buy the products and internal customers who serve others in the organization?","o":{"a":"Intense focus on the customer","b":"Empowerment of employees","c":"Concern for continual improvement","d":"Improvement in the quality of everything"},"a":"a","e":"","x":"The correct answer is <b>A<\/b>: Intense focus on the customer.","y":[]},{"n":738,"w":3,"p":2,"q":"Which characteristic of Weber's bureaucracy is described as follows: positions are organized in a hierarchy with a clear chain of command?","o":{"a":"Formal selection","b":"Authority hierarchy","c":"Impersonality","d":"Career orientation"},"a":"b","e":"","x":"The correct answer is <b>B<\/b>: Authority hierarchy.","y":[]},{"n":739,"w":3,"p":2,"q":"Which TQM characteristic is described as follows: covers the final product, deliveries, complaint response and even how politely phones are answered?","o":{"a":"Accurate measurement","b":"Intense focus on the customer","c":"Improvement in the quality of everything","d":"Process focused"},"a":"c","e":"","x":"The correct answer is <b>C<\/b>: Improvement in the quality of everything.","y":[]},{"n":740,"w":3,"p":2,"q":"On your Week 3 slide, which of the following is grouped under the Modern theories?","o":{"a":"Weber's bureaucracy","b":"The Hawthorne experiments","c":"The human rela const WK={1:'Introduction to Management',2:'Organizational Environment',3:'History and Evolution',4:'Organizational Culture',9:'Planning'};
const PL={1:'Must know',2:'High yield',3:'Good to know'};
const PC={1:'var(--p1)',2:'var(--p2)',3:'var(--p3)'};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let prog={},bm={},theme='';
try{prog=JSON.parse(localStorage.getItem('pom-prog')||'{}');bm=JSON.parse(localStorage.getItem('pom-bm')||'{}');theme=localStorage.getItem('pom-theme')||''}catch(e){}
const save=()=>{try{localStorage.setItem('pom-prog',JSON.stringify(prog));localStorage.setItem('pom-bm',JSON.stringify(bm))}catch(e){}};
if(theme)document.documentElement.dataset.theme=theme;
const S={pr:new Set([1]),wk:new Set([1,2,3,4,9]),st:'all',shuf:false};
let pool=[],i=0,picks={},done=false,armed=false;
function build(){
  pool=Q.filter(q=>S.pr.has(q.p)&&S.wk.has(q.w)&&(S.st==='all'||(S.st==='new'&&!prog[q.n])||(S.st==='wrong'&&prog[q.n]==='w')||(S.st==='mark'&&bm[q.n])));
  if(S.shuf)for(let k=pool.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[pool[k],pool[j]]=[pool[j],pool[k]]}
  i=0;picks={};done=false;render();
}
function chip(group,val,label,on){return `<button class="chip" data-g="${group}" data-v="${val}" aria-pressed="${on}">${label}</button>`}
function side(){
  let h='<h3>Priority</h3><div class="chips">'+[1,2,3].map(p=>chip('pr',p,'P'+p+' '+PL[p],S.pr.has(p))).join('')+'</div>';
  h+='<h3>Week</h3><div class="chips">'+Object.keys(WK).map(w=>chip('wk',w,'W'+w,S.wk.has(+w))).join('')+'</div>';
  h+='<h3>Show</h3><div class="chips">'+[['all','All'],['new','Unanswered'],['wrong','Missed'],['mark','Starred']].map(([v,l])=>chip('st',v,l,S.st===v)).join('')+'</div>';
  h+='<h3>Order</h3><div class="chips">'+chip('sh',0,'In order',!S.shuf)+chip('sh',1,'Shuffled',S.shuf)+'</div>';
  h+='<h3>Mastery</h3>';
  for(const p of [1,2,3]){
    const all=Q.filter(q=>q.p===p),c=all.filter(q=>prog[q.n]==='c').length,w=all.filter(q=>prog[q.n]==='w').length,t=c+w;
    h+=`<div class="stat"><b>Priority ${p}</b><span>${c}/${all.length} correct${t?', '+Math.round(c/t*100)+'% accuracy':''}</span><div class="bar"><i style="width:${c/all.length*100}%;background:var(--ok)"></i><i style="width:${w/all.length*100}%;background:var(--no)"></i></div></div>`;
  }
  h+='<p class="sub" style="font-size:.82rem">Target: above 90% on Priority 1 before moving on.</p>';
  h+=`<div class="row2"><button class="ghost" data-a="restart">Restart session</button><button class="ghost danger" data-a="reset">${armed?'Tap again to confirm':'Reset progress'}</button></div>`;
  $('side').innerHTML=h;
}
function render(){
  side();
  const card=$('card');
  if(!pool.length){card.innerHTML='<div class="empty"><h2>Nothing to show</h2><p>No questions match these filters. Try another priority, week or view.</p></div>';$('cells').innerHTML='';return}
  if(done){
    const a=Object.keys(picks).length,c=pool.filter(q=>picks[q.n]===q.a).length;
    card.innerHTML=`<div class="res"><div class="big">${a?Math.round(c/a*100):0}%</div><p>${c} correct out of ${a} answered in this session of ${pool.length}.</p><div class="row2" style="justify-content:center"><button class="btn" data-a="restart">Go again</button><button class="btn sec" data-a="missed">Review missed</button></div></div>`;
    cells();return;
  }
  const q=pool[i],pk=picks[q.n];
  const opts=['a','b','c','d'].map(k=>{
    let cl='';if(pk){cl=k===q.a?'ok':k===pk?'no':'dim'}
    return `<button class="opt ${cl}" data-k="${k}" ${pk?'disabled':''}><span class="l">${k.toUpperCase()}</span><span>${esc(q.o[k])}</span></button>`}).join('');
  const fb=pk?(pk===q.a?'<p class="fb ok">Correct</p>':`<p class="fb no">Not quite. The answer is ${q.a.toUpperCase()}.</p>`):'<p class="fb"></p>';
  card.innerHTML=`<div class="meta"><span class="tag p" style="--c:${PC[q.p]}">Priority ${q.p}</span><span class="tag">W${q.w}: ${WK[q.w]}</span><span class="cnt">${i+1} of ${pool.length}</span><button class="star" data-a="star" aria-pressed="${!!bm[q.n]}" aria-label="Star this question">${bm[q.n]?'★':'☆'}</button></div>
  <div class="prog"><i style="width:${(i+1)/pool.length*100}%"></i></div>
  <h2 class="q">${esc(q.q)}</h2><div class="opts">${opts}</div>${fb}${pk?`<div class="why"><strong>Explanation</strong><p>${q.x}</p>${q.y.length?'<ul>'+q.y.map(n=>'<li>'+n+'</li>').join('')+'</ul>':''}</div>`:''}
  <div class="nav"><button class="btn sec" data-a="prev" ${i?'':'disabled'}>Previous</button><button class="btn" data-a="next">${i===pool.length-1?'Finish':'Next'}</button></div>
  <p class="kbd">Keys: A to D to answer, Right arrow for next, Left arrow for previous, S to star.</p>`;
  cells();
}
function cells(){
  $('cells').innerHTML=pool.map((q,k)=>`<button class="${prog[q.n]||''} ${!done&&k===i?'cur':''}" data-j="${k}" title="Q${q.n}" aria-label="Go to question ${k+1}"></button>`).join('');
}
function answer(k){
  const q=pool[i];if(picks[q.n]||done)return;
  picks[q.n]=k;prog[q.n]=k===q.a?'c':'w';save();render();
}
function go(d){if(done)return;if(d>0&&i===pool.length-1){done=true;render();return}i=Math.max(0,Math.min(pool.length-1,i+d));render()}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const d=t.dataset;
  if(t.id==='theme'){const dark=getComputedStyle(document.documentElement).colorScheme==='dark';theme=dark?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('pom-theme',theme)}catch(x){}return}
  if(t.id==='fbtn'){$('side').classList.toggle('open');return}
  if(d.g){const v=d.v;
